# CMW Tender Keyword Library
# Generated from data/CMW_Tender_Keywords.xlsx
# Run: python scripts/generate_keywords.py  (regenerates this file from the xlsx)
#
# IMPORTANT: Confirm disqualifiers.yaml with CMW before going live.
#
# Schema per keyword:
#   keyword: str
#   category: int  (1-6, see categories below)
#   tier: int      (1=high-precision, 2=disambiguate, 3=broad-net)
#   notes: str     (optional; explain ambiguity or edge cases)
#
# Categories:
#   1 = Fleet & vehicle washing
#   2 = Parking-structure & floor cleaning
#   3 = Pressure-washing & building exterior
#   4 = Graffiti & specialty surface
#   5 = Industrial / facility cleaning
#   6 = Municipal / contract umbrella

