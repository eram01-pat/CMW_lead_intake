name: CMW Tender Monitor

on:
  schedule:
    # Run at 07:00 and 13:00 Eastern on weekdays (12:00 and 18:00 UTC).
    # Municipal portals don't update by the minute — twice-daily is sufficient.
    - cron: "0 12 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:  # allow manual runs from the Actions UI

permissions:
  contents: write      # needed to commit tenders.db back to the repo
  pages: write         # needed to deploy to GitHub Pages
  id-token: write      # needed for OIDC-based Pages deployment

concurrency:
  group: "tender-monitor"
  cancel-in-progress: false  # don't cancel; let the current run finish

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py --ignore-errors

      # ── State persistence: commit tenders.db back to the repo ─────────────
      # v1 choice: commit the DB each run for simplicity.
      # Tradeoff: ~17 extra commits/week, but full history and zero extra infra.
      # Phase-2 alternative: store/restore as a workflow artifact or GitHub cache.
      - name: Commit updated database
        run: |
          git config user.name  "CMW Tender Bot"
          git config user.email "actions@github.com"
          git add data/tenders.db
          git diff --cached --quiet || git commit -m "chore: update tenders.db [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
