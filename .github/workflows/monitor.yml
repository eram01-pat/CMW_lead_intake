name: CMW Tender Monitor

on:
  schedule:
    # 10:00 and 15:00 Eastern on weekdays (14:00 and 19:00 UTC)
    - cron: "0 14 * * 1-5"
    - cron: "0 19 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — collect and match but skip DB write and dashboard deploy"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "tender-monitor"
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: self-hosted
    environment:
      name: ${{ (github.event.inputs.dry_run == 'true') && 'dry-run' || 'github-pages' }}
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN MODE — no DB writes, no dashboard deploy ==="
            python pipeline.py --dry-run --ignore-errors
          else
            python pipeline.py --ignore-errors
          fi

      - name: Commit updated database
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "CMW Tender Bot"
          git config user.email "actions@github.com"
          git add data/tenders.db data/module_endpoints.yaml
          git diff --cached --quiet || git commit -m "chore: update tenders.db [skip ci]"
          git push

      - name: Upload Pages artifact
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: github.event.inputs.dry_run != 'true'
        id: pages
        uses: actions/deploy-pages@v4
